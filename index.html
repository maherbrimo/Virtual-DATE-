<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Vitrual date ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#30BFBF;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    z-index:2;
}

img{
    width:220px;
    border-radius:20px;
    margin-bottom:20px;
}

h1{
    color:white;
    margin-bottom:30px;
    font-size:2.2rem;
}

.buttons{
    position:relative;
    width:320px;
    height:170px;
    margin:auto;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    transition:.25s;
}

#yes{
    background:#28A745; 
    color:white;
    position:absolute;
    left:40px;
    top:60px;
}

#no{
    background:#D62828;
    color:white;
    position:absolute;
    right:40px;
    top:60px;
}

#celebration{
    display:none;
    animation:pop .6s ease;
}

@keyframes pop{
from{
    transform:scale(.5);
    opacity:0;
}
to{
    transform:scale(1);
    opacity:1;
}
}

.heart{
    position:absolute;
    font-size:24px;
    animation:float 5s linear infinite;
    opacity:.8;
}

@keyframes float{
0%{
    transform:translateY(100vh) rotate(0deg);
    opacity:0;
}
20%{
    opacity:1;
}
100%{
    transform:translateY(-120vh) rotate(360deg);
    opacity:0;
}
}
    
#babyboo{
    position:fixed;
    width:170px;
    right:-250px;
    bottom:20px;
    display:none;
    z-index:9999;
}

@keyframes dance{

0%{
    transform:translateY(0px) rotate(0deg);
}

25%{
    transform:translateY(-15px) rotate(-6deg);
}

50%{
    transform:translateY(0px) rotate(6deg);
}

75%{
    transform:translateY(-15px) rotate(-6deg);
}

100%{
    transform:translateY(0px) rotate(0deg);
}

} 

#spinBtn{
    display:none;
    opacity:0;
    transition:opacity .8s;

}

.showButton{
    display:inline-block !important;
    opacity:1 !important;
}
</style>
</head>

<body>

<audio id="babybooSong">
    <source src="babyboo.mp3" type="audio/mpeg">
</audio>

<img id="babyboo" src="babyboo.gif" alt="BabyBoo">

<div id="question" class="container">


<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

<h1>Oun, Will You Go on a Vitrual Date with me 
               9/8 at 3 pm? ❤️</h1>

<div class="buttons">
<button id="yes">YES 💖</button>
<button id="no">NO 😢</button>
</div>

</div>

<div id="celebration" class="container">

<h1 id="yayTitle" style="display:none;">
AYYY you said YES!! ❤️🥹
</h1>

<p id="yayText"
style="font-size:22px;margin:20px;display:none;">
Now let's decide our first date...
</p>

<button id="spinBtn" style="display:none;">
🎡 Click Here
</button>

<h2 id="result" style="display:none;"></h2>

<p id="description" style="display:none;"></p>

</div>

<script>

const noBtn=document.getElementById("no");
const dates = [

{
title:"🧠 Personality Match",
description:"We both take the same personality test separately and compare our results. Big Five could be more serious, or MBTI just for fun."
},

{
title:"❤️ 36 Questions",
description:"Take turns asking each other questions that slowly get more personal. I feel like it would be more interesting than one person just asking everything."
},

{
title:"🌎 GeoGuessr Challenge",
description:"Play GeoGuessr or something similar while screen sharing and compete against each other. Could actually be fun since you like hiking/outdoors too."
},

{
title:"🏆 Tier List Night",
description:"Make tier lists together and rank random stuff like fast food, vacation spots, music, college experiences, relationship stuff, whatever. Probably gonna end up arguing over something dumb 😂."
},

{
title:"🍿 Movie Night",
description:"Pick something funny or terrible that we can make fun of together instead of just sitting there watching something the whole time."
},

{
title:"🎮 Game Night",
description:"Roblox, Skribbl, Uno, Codenames, Minecraft, Roblox, or whatever else we can find."
},

{
title:"📸 Camera Roll Challenge",
description:"We'll give each other prompts like 'favorite memory,' 'worst haircut,' 'favorite place I've been,' or 'something nobody knows about me,' then race to find the best photo."
}

];
const yesBtn=document.getElementById("yes");

let size=1;

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

const messages = [
"Are you sure? 🥺",
"Please? ❤️",
"I'll buy you matcha 🍵",
"Think again 😭",
"You clicked the wrong button 😂",
"One more chance! 💕",
"I promise it'll be fun 🥹",
"Pretty please? 👉👈",
"I've already planned our first date 😄",
"Just press YES ❤️"
];

let messageIndex = 0;

function moveButton(){

const maxX = 250;
const maxY = 120;

const x = Math.random()*maxX;
const y = Math.random()*maxY;

noBtn.style.left = x+"px";
noBtn.style.top = y+"px";

size += 0.25;
yesBtn.style.transform = `scale(${size})`;

noBtn.innerHTML = messages[messageIndex];

messageIndex++;

if(messageIndex >= messages.length){
    messageIndex = messages.length - 1;
}
}

yesBtn.addEventListener("click", () => {

    document.getElementById("question").style.display = "none";
    document.getElementById("celebration").style.display = "block";

    createHearts();

    const hamster = document.getElementById("babyboo");
    const song = document.getElementById("babybooSong");

    hamster.style.display = "block";

    hamster.animate(
        [
            { right: "-250px" },
            { right: "30px" }
        ],
        {
            duration: 1200,
            fill: "forwards"
        }
    );

    song.play();

    hamster.style.animation = "dance .6s infinite";

    song.onended = () => {

    hamster.style.animation = "none";

    hamster.animate(
        [
            { opacity: 1 },
            { opacity: 0 }
        ],
        {
            duration: 1200,
            fill: "forwards"
        }
    );

    document.getElementById("yayTitle").style.display = "block";
    document.getElementById("yayText").style.display = "block";

    const spinBtn = document.getElementById("spinBtn");

    spinBtn.style.display = "inline-block";

    // small delay so it fades in nicely
    setTimeout(() => {
        spinBtn.style.opacity = "1";
    }, 100);

};

});

function createHearts(){

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*40)+"px";
heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},200);

}
document.getElementById("spinBtn").onclick=function(){

const random=Math.floor(Math.random()*dates.length);

const result=document.getElementById("result");
const description=document.getElementById("description");

result.style.display="block";
description.style.display="block";

result.innerHTML=dates[random].title;

description.innerHTML=
dates[random].description +
"<br><br><strong>📸 Send me a screenshot/photo of what you got 📸 </strong>";

}
</script>

</body>
</html>
