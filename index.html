<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Vitrual date ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#30BFBF;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    z-index:2;
}

img{
    width:220px;
    border-radius:20px;
    margin-bottom:20px;
}

h1{
    color:white;
    margin-bottom:30px;
    font-size:2.2rem;
}

.buttons{
    position:relative;
    width:320px;
    height:170px;
    margin:auto;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    transition:.25s;
}

#yes{
    background:#D62828;   
    color:white;
    position:absolute;
    left:40px;
    top:60px;
}

#no{
    background:#D62828;
    color:white;
    position:absolute;
    right:40px;
    top:60px;
}

#celebration{
    display:none;
    animation:pop .6s ease;
}

@keyframes pop{
from{
    transform:scale(.5);
    opacity:0;
}
to{
    transform:scale(1);
    opacity:1;
}
}

.heart{
    position:absolute;
    font-size:24px;
    animation:float 5s linear infinite;
    opacity:.8;
}

@keyframes float{
0%{
    transform:translateY(100vh) rotate(0deg);
    opacity:0;
}
20%{
    opacity:1;
}
100%{
    transform:translateY(-120vh) rotate(360deg);
    opacity:0;
}
}
</style>
</head>

<body>

<div id="question" class="container">

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

<h1>Will you go out with me? ❤️</h1>

<div class="buttons">
<button id="yes">YES 💖</button>
<button id="no">NO 😢</button>
</div>

</div>

<div id="celebration" class="container">

<h1>She Said YES!! ❤️🥹</h1>

<p style="font-size:22px;margin:20px;">
Now let's let fate decide our first date...
</p>

<button id="spinBtn">
🎡 Spin the Wheel
</button>

<h2 id="result" style="margin-top:30px;"></h2>

<p id="description" style="max-width:600px;margin:auto;"></p>

</div>

<script>

const noBtn=document.getElementById("no");
const dates = [

{
title:"🧠 Personality Match",
description:"We'll both take the same personality test, then hop on FaceTime and compare our results. Whether it's Big Five or MBTI, the fun part is seeing what matches, what doesn't, and debating how accurate it actually is."
},

{
title:"❤️ 36 Questions",
description:"We'll take turns answering thoughtful questions that get a little deeper as we go. The goal isn't to interview each other—it's to learn new things and have some great conversations."
},

{
title:"🌎 GeoGuessr Challenge",
description:"Let's put our geography skills to the test! We'll play a geography game or a GeoGuessr alternative and see who can figure out where we are first."
},

{
title:"🏙️ My Perfect Day",
description:"We'll each plan the perfect day if the other person came to visit our city. Restaurants, coffee shops, hikes, hidden gems—anything that makes home feel special."
},

{
title:"🏆 Tier List Night",
description:"We'll make a tier list together and argue over random things like fast food, music, vacation spots, movies, relationship habits, or literally anything else. Friendly debates are encouraged 😂."
},

{
title:"🍿 Movie Night",
description:"Let's find a funny or terrible movie, hit play at the same time, and laugh our way through it together while FaceTiming."
},

{
title:"🎮 Game Night",
description:"Time for some friendly competition! We can play Skribbl.io, chess, Uno, Codenames, Minecraft, Roblox, or whatever sounds the most fun."
},

{
title:"📸 Camera Roll Challenge",
description:"We'll give each other prompts like 'favorite memory,' 'worst haircut,' 'favorite place I've been,' or 'something nobody knows about me,' then race to find the best photo."
}

];
const yesBtn=document.getElementById("yes");

let size=1;

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

const messages = [
"Are you sure? 🥺",
"Please? ❤️",
"I'll buy you matcha 🍵",
"Think again 😭",
"You clicked the wrong button 😂",
"One more chance! 💕",
"I promise it'll be fun 🥹",
"Pretty please? 👉👈",
"I've already planned our first date 😄",
"Just press YES ❤️"
];

let messageIndex = 0;

function moveButton(){

const maxX = 250;
const maxY = 120;

const x = Math.random()*maxX;
const y = Math.random()*maxY;

noBtn.style.left = x+"px";
noBtn.style.top = y+"px";

size += 0.25;
yesBtn.style.transform = `scale(${size})`;

noBtn.innerHTML = messages[messageIndex];

messageIndex++;

if(messageIndex >= messages.length){
    messageIndex = messages.length - 1;
}
}

yesBtn.addEventListener("click",()=>{

document.getElementById("question").style.display="none";
document.getElementById("celebration").style.display="block";

createHearts();

});

function createHearts(){

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*40)+"px";
heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},200);

}
document.getElementById("spinBtn").onclick=function(){

const random=Math.floor(Math.random()*dates.length);

document.getElementById("result").innerHTML=dates[random].title;

document.getElementById("description").innerHTML=dates[random].description;

}
</script>

</body>
</html>
