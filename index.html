<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Go Out With Me? ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd6e7,#ffe9f3);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    text-align:center;
    z-index:2;
}

img{
    width:220px;
    border-radius:20px;
    margin-bottom:20px;
}

h1{
    color:#ff3f7f;
    margin-bottom:30px;
    font-size:2.2rem;
}

.buttons{
    position:relative;
    width:320px;
    height:170px;
    margin:auto;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:20px;
    cursor:pointer;
    transition:.25s;
}

#yes{
    background:#ff4d88;
    color:white;
    position:absolute;
    left:40px;
    top:60px;
}

#no{
    background:white;
    color:#ff4d88;
    position:absolute;
    right:40px;
    top:60px;
}

#celebration{
    display:none;
    animation:pop .6s ease;
}

@keyframes pop{
from{
    transform:scale(.5);
    opacity:0;
}
to{
    transform:scale(1);
    opacity:1;
}
}

.heart{
    position:absolute;
    font-size:24px;
    animation:float 5s linear infinite;
    opacity:.8;
}

@keyframes float{
0%{
    transform:translateY(100vh) rotate(0deg);
    opacity:0;
}
20%{
    opacity:1;
}
100%{
    transform:translateY(-120vh) rotate(360deg);
    opacity:0;
}
}
</style>
</head>

<body>

<div id="question" class="container">

<img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">

<h1>Will you go out with me? ❤️</h1>

<div class="buttons">
<button id="yes">YES 💖</button>
<button id="no">NO 😢</button>
</div>

</div>

<div id="celebration" class="container">

<h1>YAY!! ❤️🥹</h1>

<img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif">

<h2 style="color:#ff4d88;margin-top:20px;">
You just made me the happiest person! 💕
</h2>

</div>

<script>

const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");

let size=1;

noBtn.addEventListener("mouseover",moveButton);
noBtn.addEventListener("click",moveButton);

function moveButton(){

const maxX=250;
const maxY=120;

const x=Math.random()*maxX;
const y=Math.random()*maxY;

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

size+=0.12;
yesBtn.style.transform=`scale(${size})`;
}

yesBtn.addEventListener("click",()=>{

document.getElementById("question").style.display="none";
document.getElementById("celebration").style.display="block";

createHearts();

});

function createHearts(){

setInterval(()=>{

const heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*40)+"px";
heart.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);

},200);

}

</script>

</body>
</html>
